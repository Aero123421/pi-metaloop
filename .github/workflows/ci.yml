name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.19.0, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run release:check
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run package:smoke

  sfh-contract:
    strategy:
      matrix:
        sfh: [v1.4.0, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Install SFH ${{ matrix.sfh }}
        run: |
          version="${{ matrix.sfh }}"
          if [[ "$version" == "latest" ]]; then
            url=https://github.com/Aero123421/SimpleFlowHarness/releases/latest/download/sfh-installer.sh
          else
            url=https://github.com/Aero123421/SimpleFlowHarness/releases/download/$version/sfh-installer.sh
            export SFH_VERSION="${version#v}"
          fi
          curl --proto '=https' --tlsv1.2 -LsSf "$url" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify SFH machine contract
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          sfh --version
          node --experimental-strip-types --test test/sfh-machine-contract.test.ts
