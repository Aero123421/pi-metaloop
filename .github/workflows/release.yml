name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d8c243d26f7b0d3c585e9f0b # v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run package:smoke
      - name: Verify latest SFH machine contract
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/Aero123421/SimpleFlowHarness/releases/latest/download/sfh-installer.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          node --experimental-strip-types --test test/sfh-machine-contract.test.ts
      - name: Pack
        run: |
          npm pack
          sha256sum *.tgz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" *.tgz SHA256SUMS --generate-notes "${prerelease[@]}"
